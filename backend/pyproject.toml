[project]
name = "explainer"
version = "0.1.0"
description = "AI concept explainer: lesson schema, widget catalog, linter and generation"
readme = "README.md"
authors = [
    { name = "nauqh", email = "hodominhquan.work@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openrouter]>=2.54.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 130
